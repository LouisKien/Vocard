name: ${COMPOSE_PROJECT_NAME:-vocard}

x-vocard-env: &vocard-env
  - path: ${VOCARD_ENV_FILE:-.env}
    required: false

services:
  mongo:
    # MongoDB 5+ requires AVX on x86_64. Keep 4.4 pinned for Intel N4100/non-AVX homelabs.
    image: ${MONGO_IMAGE:-mongo:4.4.29-focal}
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    command: ["mongod", "--wiredTigerCacheSizeGB", "${MONGO_WIREDTIGER_CACHE_SIZE_GB:-0.25}"]
    env_file: *vocard-env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-}
      MONGO_INITDB_DATABASE: ${MONGODB_NAME:-vocard}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$${MONGO_INITDB_ROOT_USERNAME}\" ] && [ -n \"$${MONGO_INITDB_ROOT_PASSWORD}\" ]; then mongo admin -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --quiet --eval \"db.adminCommand('ping').ok\" | grep 1; else mongo admin --quiet --eval \"db.adminCommand('ping').ok\" | grep 1; fi"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      backend:
        aliases:
          - mongodb

  spotify-tokener:
    image: ${SPOTIFY_TOKENER_IMAGE:-ghcr.io/topi314/spotify-tokener:master@sha256:7841fa6144bd27b75b3ffc5d89c8201f833e0b9e2d3e8b4d5af8371504fd43f8}
    restart: unless-stopped
    init: true
    environment:
      - SPOTIFY_TOKENER_ADDR=0.0.0.0:8080
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "grep -q ':1F90' /proc/net/tcp /proc/net/tcp6 2>/dev/null"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend
      - egress

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    env_file: *vocard-env
    environment:
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-change-me}
      JAVA_TOOL_OPTIONS: "${LAVALINK_JAVA_OPTS:--Xms128m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200}"
    depends_on:
      spotify-tokener:
        condition: service_healthy
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --header=\"Authorization: $${LAVALINK_PASSWORD}\" -O - http://127.0.0.1:2333/v4/info >/dev/null"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10m
    networks:
      - backend
      - egress

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file: *vocard-env
    depends_on:
      mongo:
        condition: service_healthy
      lavalink:
        condition: service_healthy
    networks:
      - backend
      - egress

volumes:
  mongo_data:

networks:
  backend:
    driver: bridge
    internal: true
  egress:
    driver: bridge
